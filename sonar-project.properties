# SonarCloud / SonarQube — análisis de calidad en CI
# OBLIGATORIO: Sustituir sonar.organization y sonar.projectKey por los de tu proyecto en sonarcloud.io

# SonarCloud: crear proyecto en https://sonarcloud.io/projects/create y pegar aquí
sonar.projectKey=Nubestock_nubestock-backend
sonar.organization=nubestock

# Código fuente y exclusiones (controllers y services SÍ se analizan y deben testearse)
sonar.sources=src
sonar.exclusions=**/node_modules/,**/dist/,**/__tests__/,**/*.d.ts,**/types/**,**/interfaces/**,**/middleware/authMiddleware.ts,**/utils/httpLogger.ts

# Cobertura (generada por npm test)
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Ignorar archivos de test: no analizar __tests__ (solo se analiza src)
sonar.test.exclusions=**/__tests__/**

# Excluir archivos de infraestructura/configuración del análisis de cobertura
sonar.coverage.exclusions=**/config/database.ts,**/config/logger.ts,**/config/environment.ts,**/config/loadEnv.ts,**/middleware/auth.ts,**/types/**,**/interfaces/**
