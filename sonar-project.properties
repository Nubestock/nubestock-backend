# SonarCloud / SonarQube — análisis de calidad en CI
# OBLIGATORIO: Sustituir sonar.organization y sonar.projectKey por los de tu proyecto en sonarcloud.io

# SonarCloud: crear proyecto en https://sonarcloud.io/projects/create y pegar aquí
sonar.projectKey=Nubestock_nubestock-backend
sonar.organization=nubestock

# Código fuente y exclusiones
sonar.sources=src
sonar.exclusions=**/node_modules/,**/dist/,**/__tests__/,**/*.d.ts,**/types/**

# Cobertura (generada por npm test)
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Resultados de tests JUnit (generados por jest-junit)
sonar.testExecutionReportPaths=test-results/junit.xml

# Ubicación de tests
sonar.tests=__tests__
sonar.test.inclusions=**/__tests__/**/*.test.ts
