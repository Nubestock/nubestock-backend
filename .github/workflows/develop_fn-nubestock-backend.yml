name: Build and deploy Azure Functions - fn-nubestock-backend

on:
  push:
    branches:
      - develop
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment a desplegar'
        required: false
        type: choice
        options:
          - NUBESTOCK_DEV
          - NUBESTOCK_UAT
          - NUBESTOCK_PRD
        default: 'NUBESTOCK_DEV'

jobs:
  deploy:
    permissions:
      contents: read
    uses: Nubestock/nubestock-workflows/.github/workflows/functions-deploy-action.yml@master
    with:
      environment: >-
        ${{
          github.event.inputs.environment != '' && github.event.inputs.environment
          || github.ref_name == 'develop' && 'NUBESTOCK_DEV'
          || github.ref_name == 'uat' && 'NUBESTOCK_UAT'
          || github.ref_name == 'master' && 'NUBESTOCK_PRD'
          || 'NUBESTOCK_DEV'
        }}
      node_version: '22'
    secrets:
      # === Secrets CORE de Azure (ÚNICOS OBLIGATORIOS) ===

      AZ_CLIENT_ID:        ${{ secrets.AZ_CLIENT_ID }}
      AZ_CLIENT_SECRET:    ${{ secrets.AZ_CLIENT_SECRET }}   # (temporal, hasta OIDC)
      AZ_TENANT_ID:        ${{ secrets.AZ_TENANT_ID }}
      AZ_SUBSCRIPTION_ID:  ${{ secrets.AZ_SUBSCRIPTION_ID }}

      AZ_FUNCTION_APP_NAME: ${{ secrets.AZ_FUNCTION_APP_NAME }}
      AZ_RESOURCE_GROUP:    ${{ secrets.AZ_RESOURCE_GROUP }}
      FUNCTIONS_WORKER_RUNTIME: ${{ secrets.FUNCTIONS_WORKER_RUNTIME }}
      FUNCTIONS_EXTENSION_VERSION: ${{ secrets.FUNCTIONS_EXTENSION_VERSION }}
      DATABASE_HOSTNAME: ${{ secrets.DATABASE_HOSTNAME }}
      DATABASE_PORT: ${{ secrets.DATABASE_PORT }}
      DATABASE_NAME: ${{ secrets.DATABASE_NAME }}
      DATABASE_USERNAME: ${{ secrets.DATABASE_USERNAME }}
      DATABASE_PASSWORD: ${{ secrets.DATABASE_PASSWORD }}
      DB_SSL: ${{ secrets.DB_SSL }}
      NODE_ENV: ${{ secrets.NODE_ENV }}
      LOG_LEVEL: ${{ secrets.LOG_LEVEL }}
      LOG_FORMAT: ${{ secrets.LOG_FORMAT }}
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      EMAIL_ENABLED: ${{ secrets.EMAIL_ENABLED }}
      AZURE_COMMUNICATION_CONNECTION_STRING: ${{ secrets.AZURE_COMMUNICATION_CONNECTION_STRING }}
      EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
      EMAIL_FROM_NAME: ${{ secrets.EMAIL_FROM_NAME }}
      FRONTEND_URL: ${{ secrets.FRONTEND_URL }}
      RESET_PASSWORD_PATH: ${{ secrets.RESET_PASSWORD_PATH }}
      PASSWORD_RESET_TOKEN_EXPIRY: ${{ secrets.PASSWORD_RESET_TOKEN_EXPIRY }}
      BOOTSTRAP_KEY: ${{ secrets.BOOTSTRAP_KEY }}
      AzureWebJobsStorage: ${{ secrets.AzureWebJobsStorage }}
      NOTIFICATION_HUB_ENABLED: ${{ secrets.NOTIFICATION_HUB_ENABLED }}
      NOTIFICATION_HUB_CONNECTION_STRING: ${{ secrets.NOTIFICATION_HUB_CONNECTION_STRING }}
      NOTIFICATION_HUB_NAME: ${{ secrets.NOTIFICATION_HUB_NAME }}
      NOTIFICATION_HUB_INTERNAL_KEY: ${{ secrets.NOTIFICATION_HUB_INTERNAL_KEY }}
