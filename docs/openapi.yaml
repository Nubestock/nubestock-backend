  /production/register-materials:
    post:
      tags:
        - Production
      summary: Registro inicial de producción (Etapa 1 - Operador)
      description: |
        **ETAPA 1**: El operador registra el consumo de materias primas y desperdicios.
        
        Este endpoint permite al operador:
        - Seleccionar el producto final a producir
        - Ver la receta del producto
        - Registrar cuánto material usó de cada materia prima
        - Registrar desperdicios por cada material
        
        **Acciones del sistema:**
        - Crea una transacción `PROD` (pendiente) para el producto final (`direction='+', quantity=0`)
        - Crea transacciones `PROD` para cada material consumido (`direction='-', type='PROD'`)
        - Registra en `tb_ope_pending_transaction` con `is_active=true` para relacionar producto final con su transacción
        - **RESTA** las materias primas del inventario (cantidad total incluyendo desperdicio)
        - Almacena los desperdicios en las columnas `has_waste` y `waste_quantity`
        - Almacena imágenes en base64 en el campo `details` si se proporcionan
        
        **Importante:** 
        - El desperdicio se resta del inventario como parte de `quantity_used`. Si se usaron 3kg y hay 0.5kg de desperdicio, se restan 3kg del inventario.
        - Las producciones pendientes pueden completarse hasta 1 día después de su creación.
        - El `production_pending_id` retornado es el ID de la transacción `PROD` del producto final que se completará cuando el administrador registre la cantidad final.
      operationId: registerProductionMaterials
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductionMaterialsRegister'
            examples:
              without_images:
                summary: Registro sin imágenes
                description: Ejemplo básico de registro de producción sin imágenes adjuntas
                value:
                  id_product: 83
                  materials:
                    - id_product: 104
                      quantity_used: 3
                      waste: 0.5
                    - id_product: 105
                      quantity_used: 2
                      waste: 0
              with_single_image:
                summary: Registro con imagen en un material
                description: Ejemplo con imagen base64 en uno de los materiales
                value:
                  id_product: 83
                  materials:
                    - id_product: 104
                      quantity_used: 3
                      waste: 0.5
                      details: "data:image/jpeg;base64,"
                    - id_product: 105
                      quantity_used: 2
                      waste: 0
              with_multiple_images:
                summary: Registro con imágenes en múltiples materiales
                description: Ejemplo con imágenes base64 en varios materiales
                value:
                  id_product: 83
                  materials:
                    - id_product: 104
                      quantity_used: 3
                      waste: 0.5
                      details: "data:image/jpeg;base64,"
                    - id_product: 105
                      quantity_used: 2
                      waste: 0
                      details: "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mNk+M9QDwADhgGAWjR9awAAAABJRU5ErkJggg=="
              with_decimal_quantities:
                summary: Registro con cantidades decimales
                description: Ejemplo con cantidades y desperdicios en formato decimal
                value:
                  id_product: 83
                  materials:
                    - id_product: 104
                      quantity_used: 5.75
                      waste: 1.25
                    - id_product: 105
                      quantity_used: 2.5
                      waste: 0.3
                    - id_product: 106
                      quantity_used: 10.0
                      waste: 0
                      details: "data:image/jpeg;base64,"
      responses:
        '201':
          description: Consumo de materiales registrado exitosamente
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          production_pending_ids:
                            type: array
                            items:
                              type: integer
                            description: IDs de los registros en tb_ope_pending_transaction (uno por cada material)
                          product_final:
                            type: object
                            properties:
                              id:
                                type: integer
                              name:
                                type: string
                              sku:
                                type: string
                          materials_consumed:
                            type: array
                            items:
                              $ref: '#/components/schemas/ProductionMaterialResponse'
                          summary:
                            type: object
                            properties:
                              total_consumed:
                                type: number
                                format: float
                                description: Total consumido (decimal 15,2)
                              total_waste:
                                type: number
                                format: float
                                description: Total desperdicio (decimal 15,2)
                              status:
                                type: string
                                enum: [pending]
                              transactions_count:
                                type: integer
                                description: Número de transacciones PROD creadas (solo materiales)
                              pending_transactions_count:
                                type: integer
                                description: Número de registros en tb_ope_pending_transaction (uno por material)
                      message:
                        type: string
                        example: "Consumo de materiales registrado exitosamente. Se crearon 2 transacciones PROD de materiales y 2 registros en tb_ope_pending_transaction (uno por material). Pendiente registro de cantidad final por administrador."
              examples:
                without_images:
                  summary: Respuesta sin imágenes
                  value:
                    success: true
                    message: "Consumo de materiales registrado exitosamente. Se crearon 2 transacciones PROD de materiales y 2 registros en tb_ope_pending_transaction (uno por material). Pendiente registro de cantidad final por administrador."
                    data:
                      production_pending_ids: [52, 53]
                      product_final:
                        id: 83
                        name: "PAPICK"
                        sku: "PAP-001"
                      materials_consumed:
                        - id_product: 104
                          name: "Papas"
                          sku: "PAP-RAW-001"
                          quantity_used: 3
                          waste: 0.5
                          effective_quantity: 2.5
                          has_waste: true
                          current_stock: 47
                          transaction_id: 50
                          pending_transaction_id: 52
                          details: null
                        - id_product: 105
                          name: "Sal"
                          sku: "SAL-RAW-001"
                          quantity_used: 2
                          waste: 0
                          effective_quantity: 2
                          has_waste: false
                          current_stock: 98
                          transaction_id: 51
                          pending_transaction_id: 53
                          details: null
                      summary:
                        total_consumed: 5
                        total_waste: 0.5
                        status: "pending"
                        transactions_count: 2
                        pending_transactions_count: 2
                    timestamp: "2026-01-13T20:00:00Z"
                with_images:
                  summary: Respuesta con imágenes
                  value:
                    success: true
                    message: "Consumo de materiales registrado exitosamente. Se crearon 2 transacciones PROD de materiales y 2 registros en tb_ope_pending_transaction (uno por material). Pendiente registro de cantidad final por administrador."
                    data:
                      production_pending_ids: [52, 53]
                      product_final:
                        id: 83
                        name: "PAPICK"
                        sku: "PAP-001"
                      materials_consumed:
                        - id_product: 104
                          name: "Papas"
                          sku: "PAP-RAW-001"
                          quantity_used: 3
                          waste: 0.5
                          effective_quantity: 2.5
                          has_waste: true
                          current_stock: 47
                          transaction_id: 50
                          pending_transaction_id: 52
                          details: "data:image/jpeg;base64,"
                        - id_product: 105
                          name: "Sal"
                          sku: "SAL-RAW-001"
                          quantity_used: 2
                          waste: 0
                          effective_quantity: 2
                          has_waste: false
                          current_stock: 98
                          transaction_id: 51
                          pending_transaction_id: 53
                          details: "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mNk+M9QDwADhgGAWjR9awAAAABJRU5ErkJggg=="
                      summary:
                        total_consumed: 5
                        total_waste: 0.5
                        status: "pending"
                        transactions_count: 2
                        pending_transactions_count: 2
                    timestamp: "2026-01-13T20:00:00Z"
        '400':
          description: Error de validación o stock insuficiente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Producto final no encontrado
