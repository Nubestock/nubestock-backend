  /products/materials/bulk:
    post:
      tags:
        - Products
      summary: Crear múltiples materiales (bulk)
      description: |
        Crea o actualiza múltiples materiales (productos con type='MP') en una sola operación.
        Soporta tanto creación como actualización basada en SKU.
        Máximo 1000 materiales por lote.
        
        **Comportamiento**:
        - Si el SKU no existe, se crea un nuevo material
        - Si el SKU ya existe, se actualiza el material existente
        - Los SKUs duplicados en el mismo lote se marcan como error
        - Todos los materiales creados tienen type='MP' automáticamente
        
        **Validaciones de cantidad y stock mínimo**:
        - Los materiales (type='MP') siempre permiten valores decimales en `quantity` y `min_stock` (ej: 10.5, 25.75)
        
        **IMPORTANTE**: El campo `price` es obligatorio para todos los materiales (decimal 15,2, mínimo 0).
      operationId: bulkCreateMaterials
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BulkMaterialCreate'
            examples:
              materialesBulk:
                summary: Ejemplo de carga masiva de materiales
                value:
                  - name: "Papas"
                    sku: "PAP-RAW-001"
                    id_category: 2
                    id_origin: 1
                    id_measure: 1
                    quantity: 150.5
                    min_stock: 25.75
                    price: 8.75
                  - name: "Sal"
                    sku: "SAL-RAW-001"
                    id_category: 2
                    id_origin: 1
                    id_measure: 1
                    quantity: 200.0
                    min_stock: 50.0
                    price: 2.50
      responses:
        '201':
          description: Todos los materiales fueron procesados exitosamente
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/BulkMaterialResponse'
        '207':
          description: "Multi-Status: Algunos materiales fueron procesados exitosamente, otros fallaron"
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      success:
                        type: boolean
                        example: false
                      data:
                        $ref: '#/components/schemas/BulkMaterialResponse'
        '400':
          description: Error de validación o todos los materiales fallaron
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Error'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/BulkMaterialResponse'
        '401':
          description: No autenticado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

