      description: |
        Devuelve la estructura completa jerárquica de países, provincias y ciudades.
        La respuesta está organizada en una estructura anidada: países → provincias → ciudades.
        
        Puedes filtrar los resultados usando los parámetros opcionales:
        - `id_country`: Filtrar por un país específico
        - `id_province`: Filtrar por una provincia específica
        - `id_city`: Filtrar por una ciudad específica
      operationId: getCompleteLocations
      security:
        - bearerAuth: []
      parameters:
        - name: id_country
          in: query
          required: false
          description: ID del país para filtrar resultados (opcional)
          schema:
            type: integer
          example: 1
        - name: id_province
          in: query
          required: false
          description: ID de la provincia para filtrar resultados (opcional)
          schema:
            type: integer
          example: 1
        - name: id_city
          in: query
          required: false
          description: ID de la ciudad para filtrar resultados (opcional)
          schema:
            type: integer
          example: 1
      responses:
