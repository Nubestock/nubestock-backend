        Actualiza un producto existente.
        
        **Validaciones de cantidad y stock mínimo**:
        - Si el producto es `type='MP'` (Materia Prima): Permite valores decimales en `quantity` y `min_stock` (ej: 10.5, 25.75)
        - Si el producto es `type='PF'` (Producto Final): Solo permite valores enteros en `quantity` y `min_stock` (ej: 10, 25)
        
        **IMPORTANTE**: El campo `price` es obligatorio en todas las actualizaciones.
        
