      summary: Obtener rol por ID
      operationId: getRole
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Detalles del rol
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Role'

    put:
      tags:
        - Roles
      summary: Actualizar rol
      description: |
        Actualiza un rol existente en el sistema. Este endpoint permite modificar:
        - El nombre del rol
        - La descripción del rol
        - Los permisos asignados al rol (se reemplazan completamente)
        
        **Permisos requeridos**: Requiere permisos de administrador (`roles_write`, `users_manage`, o `admin`).
        
        **Bootstrap Mode**: Para la inicialización del sistema, puedes usar el header X-Bootstrap-Key 
        con el valor configurado en BOOTSTRAP_KEY para saltarse la validación de permisos.
        Ver guía completa en docs/BOOTSTRAP_GUIDE.md.
        
        **Nota importante**: Al actualizar los permisos, todos los permisos anteriores se eliminan 
        y se reemplazan por los nuevos permisos especificados en el array `permissions`.
      operationId: updateRole
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: ID del rol a actualizar (número entero)
          schema:
            type: integer
          example: 1
        - name: X-Bootstrap-Key
          in: header
          required: false
          description: |
            Key secreto para modo bootstrap (solo para inicialización del sistema).
            Debe coincidir exactamente con la variable de entorno `BOOTSTRAP_KEY`.
            Permite saltarse la validación de permisos durante la inicialización.
            **IMPORTANTE**: Solo usar durante la inicialización del sistema.
            Una vez que tengas usuarios con roles, usa los permisos normales.
          schema:
            type: string
            example: "tu_secreto_super_seguro"
      requestBody:
        required: true
        description: Datos del rol a actualizar
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoleCreate'
            examples:
              actualizarRolBasico:
                summary: Actualizar solo nombre y descripción
                value:
                  name: "Administrador"
                  description: "Rol con permisos completos del sistema"
                  permissions: []
              actualizarRolConPermisos:
                summary: Actualizar rol con permisos específicos
                value:
                  name: "Gerente de Producción"
                  description: "Rol para gestionar producción e inventario"
                  permissions: [1, 2, 3, 4, 5]
      responses:
        '200':
          description: Rol actualizado exitosamente
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Role'
                      message:
                        type: string
                        example: "Rol actualizado exitosamente"
              examples:
                actualizacionExitosa:
                  summary: Actualización exitosa
                  value:
                    success: true
                    message: "Rol actualizado exitosamente"
                    data:
                      id: 1
                      name: "Administrador"
                      description: "Rol con permisos completos"
                      is_active: true
                      creation_date: "2024-01-01T00:00:00Z"
                      modification_date: "2024-01-11T04:00:00Z"
                    timestamp: "2024-01-11T04:00:00Z"
        '400':
          description: Error de validación (datos inválidos o rol ya existe con ese nombre)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                errorValidacion:
                  summary: Error de validación
                  value:
                    success: false
                    message: "Datos de entrada inválidos"
                    errors:
                      - field: "name"
                        message: "Nombre del rol es requerido"
                    timestamp: "2024-01-11T04:00:00Z"
                rolDuplicado:
                  summary: Rol duplicado
                  value:
                    success: false
                    message: "Ya existe un rol con ese nombre"
                    timestamp: "2024-01-11T04:00:00Z"
        '401':
          description: No autenticado (token inválido o expirado)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                noAutenticado:
                  summary: No autenticado
                  value:
                    success: false
                    message: "Token inválido o expirado"
                    timestamp: "2024-01-11T04:00:00Z"
        '403':
          description: Sin permisos (requiere roles_write, users_manage, o admin). Usa X-Bootstrap-Key para inicialización.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                sinPermisos:
                  summary: Sin permisos
                  value:
                    success: false
                    message: "No tienes permisos para realizar esta acción. Se requiere alguno de los siguientes permisos: roles_write, users_manage, admin"
                    timestamp: "2024-01-11T04:00:00Z"
        '404':
          description: Rol no encontrado (el ID proporcionado no existe)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                rolNoEncontrado:
                  summary: Rol no encontrado
                  value:
                    success: false
                    message: "Rol no encontrado"
                    timestamp: "2024-01-11T04:00:00Z"
        '500':
          description: Error interno del servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    delete:
      tags:
        - Roles
      summary: Eliminar rol
      operationId: deleteRole
