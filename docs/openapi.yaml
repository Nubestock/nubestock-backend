  /products:
    get:
      tags:
        - Products
      summary: Listar productos
      description: Obtiene una lista de productos (puede filtrar por type='MP' o type='PF')
      operationId: listProducts
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 10
        - name: type
          in: query
          schema:
            type: string
            enum: [MP, PF]
          description: Filtrar por tipo (MP=Materia Prima, PF=Producto Final)
        - name: search
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Lista de productos
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PaginatedResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/Product'
        '401':
          description: No autenticado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    post:
      tags:
        - Products
      summary: Crear producto
      description: |
        Crea un nuevo producto (MP o PF).
        
        **Validaciones de cantidad y stock mínimo**:
        - Si `type='MP'` (Materia Prima): Permite valores decimales en `quantity` y `min_stock` (ej: 10.5, 25.75)
        - Si `type='PF'` (Producto Final): Solo permite valores enteros en `quantity` y `min_stock` (ej: 10, 25)
        
        **IMPORTANTE**: El campo `price` es obligatorio (decimal 15,2, mínimo 0).
        
        Si se intenta crear un producto PF con valores decimales, se retornará un error de validación.
      operationId: createProduct
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductCreate'
            examples:
              productoFinal:
                summary: Producto Final (solo enteros)
                value:
                  name: "PAPICK"
                  sku: "PAP-001"
                  type: "PF"
                  id_category: 1
                  id_origin: 1
                  id_measure: 1
                  quantity: 100
                  min_stock: 10
                  price: 12.50
              materiaPrima:
                summary: Materia Prima (permite decimales)
                value:
                  name: "Papas"
                  sku: "PAP-RAW-001"
                  type: "MP"
                  id_category: 2
                  id_origin: 1
                  id_measure: 1
                  quantity: 150.5
                  min_stock: 25.75
                  price: 8.75
      responses:
        '201':
          description: Producto creado exitosamente
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Product'
        '400':
          description: Error de validación
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /products/bulk:
    post:
      tags:
        - Products
      summary: Crear múltiples productos (bulk)
      description: |
        Crea o actualiza múltiples productos en una sola operación. 
        Soporta tanto creación como actualización basada en SKU.
        Máximo 1000 productos por lote.
        
        **Comportamiento**:
        - Si el SKU no existe, se crea un nuevo producto
        - Si el SKU ya existe, se actualiza el producto existente
        - Los SKUs duplicados en el mismo lote se marcan como error
        
        **IMPORTANTE**: El campo `price` es obligatorio para todos los productos (decimal 15,2, mínimo 0).
      operationId: bulkCreateProducts
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BulkProductCreate'
            examples:
              productosBulk:
                summary: Ejemplo de carga masiva de productos
                value:
                  - name: "PAPICK"
                    sku: "PAP-001"
                    type: "PF"
                    id_category: 1
                    id_origin: 1
                    id_measure: 1
                    quantity: 100
                    min_stock: 10
                    price: 12.50
                  - name: "Papas"
                    sku: "PAP-RAW-001"
                    type: "MP"
                    id_category: 2
                    id_origin: 1
                    id_measure: 1
                    quantity: 150.5
                    min_stock: 25.75
                    price: 8.75
      responses:
        '201':
          description: Todos los productos fueron procesados exitosamente
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/BulkResponse'
        '207':
          description: "Multi-Status: Algunos productos fueron procesados exitosamente, otros fallaron"
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      success:
                        type: boolean
                        example: false
                      data:
                        $ref: '#/components/schemas/BulkResponse'
        '400':
          description: Error de validación o todos los productos fallaron
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Error'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/BulkResponse'

  /products/{id}:
    get:
      tags:
        - Products
      summary: Obtener producto por ID
      operationId: getProduct
