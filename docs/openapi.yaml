                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/Permission'
    
    post:
      tags:
        - Roles
      summary: Crear permiso
      description: |
        Crea un nuevo permiso en el sistema. Los permisos definen las acciones que los usuarios 
        pueden realizar en diferentes recursos del sistema.
        
        **Permisos requeridos**: Requiere permisos de administrador (`roles_write`, `users_manage`, o `admin`).
        
        **Bootstrap Mode**: Para la inicialización del sistema, puedes usar el header X-Bootstrap-Key 
        con el valor configurado en BOOTSTRAP_KEY para saltarse la validación de permisos.
        Ver guía completa en docs/BOOTSTRAP_GUIDE.md.
        
        **Campos requeridos**:
        - name: Nombre único del permiso (ej: user_manage, roles_write)
        - resource: Recurso del sistema (ej: users, roles, products)
        - action: Acción permitida (ej: read, write, manage, admin)
        - description: Descripción del permiso (opcional)
      operationId: createPermission
      security:
        - bearerAuth: []
      parameters:
        - name: X-Bootstrap-Key
          in: header
          required: false
          description: |
            Key secreto para modo bootstrap (solo para inicialización del sistema).
            Debe coincidir exactamente con la variable de entorno `BOOTSTRAP_KEY`.
            Permite saltarse la validación de permisos durante la inicialización.
            **IMPORTANTE**: Solo usar durante la inicialización del sistema.
            Una vez que tengas usuarios con roles, usa los permisos normales.
          schema:
            type: string
            example: "tu_secreto_super_seguro"
      requestBody:
        required: true
        description: Datos del permiso a crear
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - resource
                - action
              properties:
                name:
                  type: string
                  description: "Nombre único del permiso (ej: user_manage, roles_write)"
                  example: "products_read"
                description:
                  type: string
                  description: Descripción del permiso (opcional)
                  example: "Leer información de productos"
                resource:
                  type: string
                  description: "Recurso del sistema (ej: users, roles, products, sales)"
                  example: "products"
                action:
                  type: string
                  description: "Acción permitida (ej: read, write, manage, view, admin)"
                  example: "read"
            examples:
              crearPermisoLectura:
                summary: Crear permiso de lectura
                value:
                  name: "products_read"
                  description: "Leer información de productos"
                  resource: "products"
                  action: "read"
              crearPermisoEscritura:
                summary: Crear permiso de escritura
                value:
                  name: "roles_write"
                  description: "Crear, actualizar y eliminar roles"
                  resource: "roles"
                  action: "write"
              crearPermisoAdministracion:
                summary: Crear permiso de administración
                value:
                  name: "users_manage"
                  description: "Gestionar usuarios (incluye lectura, escritura y eliminación)"
                  resource: "users"
                  action: "manage"
      responses:
        '201':
          description: Permiso creado exitosamente
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Permission'
                      message:
                        type: string
                        example: "Permiso creado exitosamente"
              examples:
                permisoCreado:
                  summary: Permiso creado exitosamente
                  value:
                    success: true
                    message: "Permiso creado exitosamente"
                    data:
                      id: 20
                      name: "products_read"
                      description: "Leer información de productos"
                      resource: "products"
                      action: "read"
                      is_active: true
                      creation_date: "2024-01-11T04:00:00Z"
                      modification_date: "2024-01-11T04:00:00Z"
                    timestamp: "2024-01-11T04:00:00Z"
        '400':
          description: Error de validación (datos inválidos o permiso ya existe)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                errorValidacion:
