                        $ref: '#/components/schemas/Transaction'

  /production/{id}/complete:
    put:
      tags:
        - Production
      summary: Completar producción (Etapa 2 - Administrador)
      description: |
        **ETAPA 2**: El administrador completa el registro de producción con la cantidad de producto final generado.
        
        Este endpoint permite al administrador:
        - Ver el reporte de producción diaria con materias primas gastadas
        - Registrar cuánto producto final se generó realmente
        
        **Acciones del sistema:**
        - Busca el registro en `tb_ope_pending_transaction` con `is_active=true` para la transacción del producto final
        - Verifica que no tenga más de 1 día de antigüedad
        - **Actualiza** la transacción `PROD` del producto final con la cantidad final
        - Marca `is_active=false` en `tb_ope_pending_transaction` para completar la producción
        - **SUMA** el producto final al inventario
        - Obtiene los materiales consumidos desde transacciones `PROD` del mismo día
        
        **Requisitos:**
        - La producción debe estar en estado `pending` (tiene registro en `tb_ope_pending_transaction` con `is_active=true`)
        - La transacción no debe tener más de 1 día de antigüedad
        - Solo se puede completar una vez
      operationId: completeProduction
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: ID de la transacción PROD del producto final (pendiente, debe tener registro en tb_ope_pending_transaction con is_active=true)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - quantity
              properties:
                quantity:
                  type: number
                  format: float
                  minimum: 0.01
                  description: Cantidad de producto final generado (decimal 15,2)
            example:
              quantity: 10
      responses:
        '200':
          description: Producción completada exitosamente
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          production_id:
                            type: integer
                            description: ID de la transacción PROD actualizada con la cantidad final
                          product_final:
                            type: object
                            properties:
                              id:
                                type: integer
                              name:
                                type: string
                              sku:
                                type: string
                              quantity_generated:
                                type: number
                                format: float
                                description: Cantidad de producto final generado (decimal 15,2)
                          materials_consumed:
                            type: array
                            items:
                              $ref: '#/components/schemas/ProductionMaterialResponse'
                            description: Materiales consumidos (obtenidos desde transacciones PROD del mismo día)
                          status:
                            type: string
                            enum: [completed]
                      message:
                        type: string
                        example: "Producción completada: 10 unidades de producto final agregadas al inventario. Transacción PROD actualizada y marcada como completada en tb_ope_pending_transaction."
        '400':
          description: Error de validación, producción ya completada, o producción con más de 1 día de antigüedad
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Producción pendiente no encontrada (no existe registro en tb_ope_pending_transaction con is_active=true)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

