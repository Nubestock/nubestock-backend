                    message: "El nombre del permiso es requerido"
                    timestamp: "2024-01-11T04:00:00Z"
                permisoDuplicado:
                  summary: Permiso duplicado
                  value:
                    success: false
                    message: "Ya existe un permiso con ese nombre"
