                          product_name: "PAPICK"
                          sku: "PAP-001"
                          category_name: "Snacks"
                          status: "pending"
                          production_details:
                            materials_consumed:
                              - id_product: 104
                                name: "Papas"
                                sku: "PAP-RAW-001"
                                quantity_used: 3
                                waste: 0.5
                                effective_quantity: 2.5
                                has_waste: true
                                current_stock: 50
                                transaction_id: 124
                                details: null
                              - id_product: 105
                                name: "Sal"
                                sku: "SAL-RAW-001"
                                quantity_used: 2
                                waste: 0
                                effective_quantity: 2
                                has_waste: false
                                current_stock: 100
                                transaction_id: 125
                                details: null
                            total_consumed: 5
                            total_waste: 0.5
                            registered_by: 5
                            registered_at: "2026-01-12T10:00:00Z"
                      summary:
                        total: 3
