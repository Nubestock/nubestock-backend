openapi: 3.0.3
info:
  title: Nubestock Backend API
  description: |
    API REST para el sistema de producción Nubestock.
    
    Este sistema gestiona inventario, producción, ventas, clientes, productos, maquinaria, mantenimientos y alertas
    para empresas productoras de snacks.
    
    ## Autenticación
    La API utiliza autenticación basada en JWT (JSON Web Tokens). Para obtener un token:
    1. Usa el endpoint `/api/auth/login` con tus credenciales
    2. El token se devuelve en el campo `data.token`
    3. Incluye el token en el header `Authorization: Bearer {token}` para todas las peticiones protegidas
    
    ## Esquema de Base de Datos
    - Todos los IDs son números enteros (integer) desde la migración al nuevo esquema
    - Las columnas usan snake_case (ej: `creation_date`, `is_active`)
    - Los productos unifican materiales y productos finales con el campo `type` ('MP' = Materia Prima, 'PF' = Producto Final)
    - La producción se registra como transacciones con `type='PROD'`
    - Las producciones pendientes se identifican mediante la tabla `tb_ope_pending_transaction` con `is_active=true`
    - **Flujo de Producción:**
      - **Etapa 1 (Operador)**: Crea transacciones `PROD` para materiales consumidos (`direction='-'`) y producto final pendiente (`direction='+', quantity=0`). Registra en `tb_ope_pending_transaction` con `is_active=true`
      - **Etapa 2 (Administrador)**: Actualiza la transacción `PROD` del producto final con la cantidad final y marca `is_active=false` en `tb_ope_pending_transaction`
    
    ## Validaciones de Cantidad y Stock Mínimo
    - **Productos tipo MP (Materia Prima)**: Permiten valores decimales en `quantity` y `min_stock` (ej: 10.5, 25.75)
    - **Productos tipo PF (Producto Final)**: Solo permiten valores enteros en `quantity` y `min_stock` (ej: 10, 25)
    - Estas validaciones se aplican tanto en creación normal como en carga masiva (bulk)
  version: 2.0.0
  contact:
    name: Nubestock Team
    email: support@nubestock.com
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT

servers:
  - url: https://nubestock-functions.azurewebsites.net/api
    description: Producción (Azure Functions)
  - url: https://cnm3rvxd-7071.use2.devtunnels.ms/api
    description: Desarrollo local

tags:
  - name: Authentication
    description: Autenticación y gestión de tokens
  - name: Users
    description: Gestión de usuarios del sistema
  - name: Products
    description: Gestión de productos, materiales, categorías y recetas
  - name: Sales
    description: Gestión de ventas y clientes
  - name: Production
    description: Registro y consulta de producción
  - name: Clients
    description: Gestión de clientes
  - name: Locations
    description: Gestión de ubicaciones (países, provincias, ciudades)
  - name: Roles
    description: Gestión de roles y permisos
  - name: Alerts
    description: Sistema de alertas
  - name: Machinery
    description: Gestión de maquinaria y mantenimientos
  - name: Stats
    description: Estadísticas y reportes
  - name: System
    description: Endpoints del sistema (health check, etc.)

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Token JWT obtenido del endpoint /api/auth/login

  schemas:
    Error:
      type: object
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
          example: "Error message"
        timestamp:
          type: string
          format: date-time
        errors:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
              message:
                type: string

    SuccessResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
        data:
          type: object
        timestamp:
          type: string
          format: date-time

    PaginatedResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessResponse'
        - type: object
          properties:
            pagination:
              type: object
              properties:
                page:
                  type: integer
                limit:
                  type: integer
                total:
                  type: integer
                totalPages:
                  type: integer

    # Authentication
    LoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          example: "admin@nubestock.com"
        password:
          type: string
          format: password
          example: "Admin123456"

    LoginResponse:
      type: object
      properties:
        user:
          type: object
          properties:
            id:
              type: integer
            name:
              type: string
            email:
              type: string
            phone:
              type: string
            is_active:
              type: boolean
            last_login:
              type: string
              format: date-time
        token:
          type: string
        refreshToken:
          type: string
        expiresIn:
          type: integer
          description: Tiempo de expiración en segundos

    RegisterRequest:
      type: object
      required:
        - name
        - email
        - password
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 100
          example: "Juan Pérez"
        email:
          type: string
          format: email
          example: "juan@example.com"
        password:
          type: string
          minLength: 8
          maxLength: 100
          format: password
        phone:
          type: string
          minLength: 10
          maxLength: 20
          example: "+593999999999"

    RefreshTokenRequest:
      type: object
      required:
        - refreshToken
      properties:
        refreshToken:
          type: string

    ChangePasswordRequest:
      type: object
      required:
        - currentPassword
        - newPassword
      properties:
        currentPassword:
          type: string
          format: password
        newPassword:
          type: string
          format: password
          minLength: 8

    ResetPasswordRequest:
      type: object
      required:
        - email
      properties:
        email:
          type: string
          format: email

    ResetPasswordConfirmRequest:
      type: object
      required:
        - token
        - newPassword
      properties:
        token:
          type: string
          description: Token de reset de contraseña recibido por email
        newPassword:
          type: string
          format: password
          minLength: 8
          description: Nueva contraseña

    # User
    User:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        email:
          type: string
          format: email
        phone:
          type: string
        is_active:
          type: boolean
        last_login:
          type: string
          format: date-time
        creation_date:
          type: string
          format: date-time
        modification_date:
          type: string
          format: date-time

    UserCreate:
      type: object
      required:
        - name
        - email
        - password
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 100
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
        phone:
          type: string

    UserUpdate:
      type: object
      properties:
        name:
          type: string
        email:
          type: string
          format: email
        phone:
          type: string
        is_active:
          type: boolean

    # Product
    Product:
      type: object
      properties:
        id:
          type: integer
        id_category:
          type: integer
        id_origin:
          type: integer
        id_measure:
          type: integer
        name:
          type: string
        sku:
          type: string
        type:
          type: string
          enum: [MP, PF]
          description: MP = Materia Prima, PF = Producto Final
        min_stock:
          type: number
          format: float
          description: |
            Stock mínimo del producto (decimal 15,2).
            - Si type='MP': Permite valores decimales (ej: 10.5)
            - Si type='PF': Solo permite valores enteros (ej: 10)
        quantity:
          type: number
          format: float
          description: |
            Cantidad actual en inventario (decimal 15,2).
            - Si type='MP': Permite valores decimales (ej: 25.75)
            - Si type='PF': Solo permite valores enteros (ej: 25)
        price:
          type: number
          format: float
          description: Precio del producto (decimal 15,2) - obligatorio
          example: 12.50
        is_active:
          type: boolean
        creation_date:
          type: string
          format: date-time

    ProductCreate:
      type: object
      required:
        - name
        - sku
        - type
        - id_category
        - id_origin
        - id_measure
        - min_stock
        - price
      properties:
        name:
          type: string
        sku:
          type: string
        type:
          type: string
          enum: [MP, PF]
          description: MP = Materia Prima, PF = Producto Final
        id_category:
          type: integer
        id_origin:
          type: integer
        id_measure:
          type: integer
        quantity:
          type: number
          format: float
          minimum: 0
          default: 0
          description: |
            Cantidad inicial del producto (decimal 15,2).
            - Si type='MP': Permite valores decimales (ej: 10.5)
            - Si type='PF': Solo permite valores enteros (ej: 10)
        min_stock:
          type: number
          format: float
          minimum: 0
          description: |
            Stock mínimo del producto (decimal 15,2).
            - Si type='MP': Permite valores decimales (ej: 5.5)
            - Si type='PF': Solo permite valores enteros (ej: 5)
        price:
          type: number
          format: float
          minimum: 0
          description: Precio del producto (decimal 15,2) - obligatorio
          example: 12.50

    BulkProductCreate:
      type: array
      minItems: 1
      maxItems: 1000
      items:
        type: object
        required:
          - name
          - sku
          - id_origin
          - id_measure
          - price
        properties:
          name:
            type: string
            minLength: 2
            maxLength: 200
          sku:
            type: string
            minLength: 2
            maxLength: 100
          id_category:
            type: integer
            nullable: true
          id_origin:
            type: integer
          id_measure:
            type: integer
          type:
            type: string
            enum: [MP, PF]
            default: PF
          quantity:
            type: number
            minimum: 0
            default: 0
          min_stock:
            type: number
            minimum: 0
            default: 0
          price:
            type: number
            format: float
            minimum: 0
            description: Precio del producto (decimal 15,2) - obligatorio
            example: 12.50

    BulkMaterialCreate:
      type: array
      minItems: 1
      maxItems: 1000
      items:
        type: object
        required:
          - name
          - sku
          - id_origin
          - id_measure
          - price
        properties:
          name:
            type: string
            minLength: 2
            maxLength: 200
          sku:
            type: string
            minLength: 2
            maxLength: 100
          id_category:
            type: integer
            nullable: true
          id_origin:
            type: integer
          id_measure:
            type: integer
          quantity:
            type: number
            format: float
            minimum: 0
            default: 0
            description: |
              Cantidad inicial del material (decimal 15,2).
              Los materiales (type='MP') siempre permiten valores decimales (ej: 10.5, 25.75)
          min_stock:
            type: number
            format: float
            minimum: 0
            default: 0
            description: |
              Stock mínimo del material (decimal 15,2).
              Los materiales (type='MP') siempre permiten valores decimales (ej: 5.5, 10.25)
          price:
            type: number
            format: float
            minimum: 0
            description: Precio del material (decimal 15,2) - obligatorio
            example: 8.75

    BulkResponse:
      type: object
      properties:
        total:
          type: integer
          description: Total de elementos procesados
        created:
          type: integer
          description: Número de elementos creados
        updated:
          type: integer
          description: Número de elementos actualizados
        failed:
          type: integer
          description: Número de elementos que fallaron
        products:
          type: array
          items:
            $ref: '#/components/schemas/Product'
          description: Lista de productos creados/actualizados exitosamente
        errors:
          type: array
          items:
            type: object
            properties:
              index:
                type: integer
                description: Índice del elemento en el array original (basado en 1)
              sku:
                type: string
              name:
                type: string
              error:
                type: string
          description: Lista de errores por elemento fallido

    BulkClientCreate:
      type: array
      minItems: 1
      maxItems: 1000
      items:
        type: object
        required:
          - name
          - identification
          - identification_type
          - email
          - phone
          - address
          - id_province
          - id_city
        properties:
          name:
            type: string
            minLength: 2
            maxLength: 200
            description: Nombre del cliente
            example: "Empresa ABC S.A."
          identification:
            type: string
            minLength: 10
            maxLength: 13
            description: Número de identificación (cédula o RUC)
            example: "1234567890123"
          identification_type:
            type: string
            enum: [CED, RUC]
            description: Tipo de identificación (CED=Cédula, RUC=RUC)
            example: "RUC"
          email:
            type: string
            format: email
            maxLength: 200
            description: Email del cliente
            example: "contacto@empresaabc.com"
          phone:
            type: string
            minLength: 7
            maxLength: 20
            description: Teléfono del cliente
            example: "+593987654321"
          address:
            type: string
            maxLength: 500
            description: Dirección del cliente
            example: "Av. Principal 123"
          id_province:
            type: integer
            description: ID de la provincia
            example: 1
          id_city:
            type: integer
            description: ID de la ciudad
            example: 1
          requires_credit:
            type: boolean
            default: false
            description: Indica si el cliente requiere crédito
            example: false
          credit_limit:
            type: number
            minimum: 0
            nullable: true
            description: Límite de crédito (opcional, solo si requires_credit es true)
            example: 10000
          credit_days:
            type: integer
            minimum: 0
            default: 0
            description: Días de crédito
            example: 30
          is_active:
            type: boolean
            default: true
            description: Estado activo del cliente
            example: true

    BulkMaterialResponse:
      type: object
      properties:
        total:
          type: integer
          description: Total de materiales procesados
        created:
          type: integer
          description: Número de materiales creados
        updated:
          type: integer
          description: Número de materiales actualizados
        failed:
          type: integer
          description: Número de materiales que fallaron
        materials:
          type: array
          items:
            $ref: '#/components/schemas/Product'
          description: Lista de materiales creados/actualizados exitosamente
        errors:
          type: array
          items:
            type: object
            properties:
              index:
                type: integer
                description: Índice del elemento en el array original (basado en 1)
              sku:
                type: string
              name:
                type: string
              error:
                type: string
          description: Lista de errores por elemento fallido

    BulkClientResponse:
      type: object
      properties:
        total:
          type: integer
          description: Total de clientes procesados
        created:
          type: integer
          description: Número de clientes creados
        updated:
          type: integer
          description: Número de clientes actualizados
        failed:
          type: integer
          description: Número de clientes que fallaron
        clients:
          type: array
          items:
            $ref: '#/components/schemas/Client'
          description: Lista de clientes creados/actualizados exitosamente
        errors:
          type: array
          items:
            type: object
            properties:
              index:
                type: integer
                description: Índice del elemento en el array original (basado en 1)
                example: 2
              identification:
                type: string
                description: Identificación del cliente que falló
                example: "1234567890"
              name:
                type: string
                description: Nombre del cliente que falló
                example: "Cliente Duplicado"
              error:
                type: string
                description: Mensaje de error
                example: "Identificación duplicada en el batch"
          description: Lista de errores por elemento fallido

    Category:
      type: object
      properties:
        id:
          type: integer
          description: ID de la categoría
          example: 1
        name:
          type: string
          description: Nombre de la categoría
          example: "Electrónica"
        idpcategory:
          type: integer
          nullable: true
          description: ID de la categoría padre (null para categorías raíz)
          example: null
        is_active:
          type: boolean
          description: Estado activo de la categoría
          example: true
        creation_date:
          type: string
          format: date-time
          description: Fecha de creación
        modification_date:
          type: string
          format: date-time
          description: Fecha de última modificación

    Measure:
      type: object
      properties:
        id:
          type: integer
          description: ID de la medida
          example: 1
        name:
          type: string
          maxLength: 5
          description: Abreviatura de la medida (máximo 5 caracteres)
          example: "KG"
        description:
          type: string
          maxLength: 100
          description: Descripción completa de la medida (máximo 100 caracteres)
          example: "Kilogramos"
        is_active:
          type: boolean
          description: Estado activo de la medida
          example: true
        creation_date:
          type: string
          format: date-time
          description: Fecha de creación
        modification_date:
          type: string
          format: date-time
          description: Fecha de última modificación

    Origin:
      type: object
      properties:
        id:
          type: integer
          description: ID del origen
        id_city:
          type: integer
          description: ID de la ciudad
        name:
          type: string
          description: Nombre del origen
        id_facility:
          type: string
          nullable: true
          description: ID de la instalación o facilidad (opcional)
        is_active:
          type: boolean
          description: Estado activo del origen
        creation_date:
          type: string
          format: date-time
          description: Fecha de creación
        modification_date:
          type: string
          format: date-time
          nullable: true
          description: Fecha de última modificación
        city_name:
          type: string
          description: Nombre de la ciudad
        province_name:
          type: string
          description: Nombre de la provincia
        country_name:
          type: string
          description: Nombre del país
        country_code:
          type: string
          description: Código del país
        full_location:
          type: string
          description: Ubicación completa formateada

    Receipe:
      type: object
      properties:
        id:
          type: integer
        id_product:
          type: integer
          description: Solo Producto Final (type='PF')

    # Client
    Client:
      type: object
      properties:
        id:
          type: integer
        id_city:
          type: integer
        id_province:
          type: integer
        name:
          type: string
        identification:
          type: string
        identification_type:
          type: string
          enum: [CED, RUC]
        email:
          type: string
          format: email
        phone:
          type: string
        address:
          type: string
        requires_credit:
          type: boolean
        credit_limit:
          type: number
        credit_days:
          type: integer
        is_active:
          type: boolean
        creation_date:
          type: string
          format: date-time

    ClientCreate:
      type: object
      required:
        - name
        - identification
        - identification_type
        - email
        - id_province
        - id_city
      properties:
        name:
          type: string
        identification:
          type: string
        identification_type:
          type: string
          enum: [CED, RUC]
        email:
          type: string
          format: email
        phone:
          type: string
        address:
          type: string
        id_province:
          type: integer
        id_city:
          type: integer
        requires_credit:
          type: boolean
          default: false
        credit_limit:
          type: number
        credit_days:
          type: integer

    # Sale
    Sale:
      type: object
      properties:
        id:
          type: integer
        id_client:
          type: integer
        id_user:
          type: integer
        sale_date:
          type: string
          format: date-time
          nullable: true
          description: Fecha de la venta (puede ser null si aún no se ha registrado)
        total_amount:
          type: number
        status:
          type: string
          enum: [pending, paid, overdue, cancelled, completed]
          description: Estado de la venta. 'completed' es equivalente a 'paid'
        method:
          type: string
          enum: [cash, card, credit, transfer, check, other]
        due_date:
          type: string
          format: date-time
        dispatch_guide:
          type: string
        notes:
          type: string
        is_active:
          type: boolean
        creation_date:
          type: string
          format: date-time
        modification_date:
          type: string
          format: date-time
          nullable: true
        # Campos adicionales de JOINs (solo en listado)
        client_name:
          type: string
          description: Nombre del cliente (solo en listado)
          nullable: true
        identification:
          type: string
          description: Identificación del cliente (solo en listado)
          nullable: true
        user_name:
          type: string
          description: Nombre del usuario que creó la venta (solo en listado)
          nullable: true

    SaleCreate:
      type: object
      required:
        - id_client
        - total_amount
        - method
        - due_date
        - dispatch_guide
        - products
      properties:
        id_client:
          type: integer
        total_amount:
          type: number
        method:
          type: string
          enum: [cash, card, credit, transfer, check, other]
        status:
          type: string
          enum: [pending, paid, overdue, cancelled, completed]
          default: pending
          description: Estado de la venta. 'completed' es equivalente a 'paid'
        due_date:
          type: string
          format: date-time
        dispatch_guide:
          type: string
        notes:
          type: string
        products:
          type: array
          items:
            type: object
            properties:
              id_product:
                type: integer
              quantity:
                type: number

    SaleDetail:
      type: object
      description: Estructura de respuesta para GET /sales/{id}
      properties:
        sale:
          type: object
          properties:
            sale_id:
              type: integer
            status:
              type: string
              enum: [pending, paid, overdue, cancelled, completed]
            total_sale:
              type: number
            dispatch_guide:
              type: string
            creation_date:
              type: string
              format: date-time
            due_date:
              type: string
              format: date
        client:
          type: object
          properties:
            name:
              type: string
            identification:
              type: string
        items:
          type: array
          items:
            type: object
            properties:
              sale_detail_id:
                type: integer
              product_name:
                type: string
              product_price:
                type: number
              sku:
                type: string
              quantity:
                type: number
                description: Cantidad del producto en la venta

    # Production/Transaction
    Transaction:
      type: object
      properties:
        id:
          type: integer
        id_product:
          type: integer
        id_user:
          type: integer
        quantity:
          type: number
          format: float
          description: Cantidad (decimal 15,2)
        type:
          type: string
          enum: [IN, OUT, SAL, PROD]
          description: |
            IN=Ingreso, OUT=Salida no comercial, SAL=Venta, PROD=Producción
        direction:
          type: string
          enum: ['+', '-']
        has_waste:
          type: boolean
          description: Indica si la transacción tiene desperdicio asociado
        waste_quantity:
          type: number
          format: float
          description: Cantidad de desperdicio (decimal 15,2) - solo si has_waste es true
        creation_date:
          type: string
          format: date-time
        modification_date:
          type: string
          format: date-time
          nullable: true

    ProductionRegister:
      type: object
      required:
        - id_product
        - quantity
      properties:
        id_product:
          type: integer
          description: ID del Producto Final (type='PF')
        quantity:
          type: number
          format: float
          minimum: 0.01
          description: Cantidad de producto final producido (decimal 15,2)

    MaterialConsumption:
      type: object
      required:
        - id_product
        - quantity_used
      properties:
        id_product:
          type: integer
          description: ID del Material (type='MP')
        quantity_used:
          type: number
          format: float
          minimum: 0.01
          description: Cantidad total usada del material (incluye desperdicio) - decimal(15,2)
        waste:
          type: number
          format: float
          minimum: 0
          default: 0
          description: Cantidad de desperdicio (decimal 15,2) - solo informativo, se resta del inventario como parte de quantity_used
        details:
          type: string
          nullable: true
          description: |
            Imagen en formato base64 (data URI) para documentar el material consumido.
            Formato: data:image/{tipo};base64,{datos_base64}
            Ejemplo: data:image/jpeg;base64,/9j/4AAQSkZJRg...

    ProductionMaterialsRegister:
      type: object
      required:
        - id_product
        - materials
      properties:
        id_product:
          type: integer
          description: ID del Producto Final (type='PF')
        materials:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/MaterialConsumption'
          description: Lista de materiales consumidos con sus cantidades y desperdicios

    ProductionMaterialResponse:
      type: object
      properties:
        id_product:
          type: integer
        name:
          type: string
        sku:
          type: string
        quantity_used:
          type: number
          format: float
          description: Cantidad total usada (decimal 15,2)
        waste:
          type: number
          format: float
          description: Cantidad de desperdicio (decimal 15,2)
        effective_quantity:
          type: number
          format: float
          description: Cantidad efectivamente utilizada (quantity_used - waste)
        has_waste:
          type: boolean
        transaction_id:
          type: integer

    ProductionPendingDetails:
      type: object
      properties:
        materials_consumed:
          type: array
          items:
            $ref: '#/components/schemas/ProductionMaterialResponse'
        total_consumed:
          type: number
          format: float
          description: Total de materiales consumidos (decimal 15,2)
        total_waste:
          type: number
          format: float
          description: Total de desperdicio (decimal 15,2)
        registered_by:
          type: integer
          description: ID del usuario que registró la producción (operador)
        registered_at:
          type: string
          format: date-time
          description: Fecha y hora de registro inicial
        completed_at:
          type: string
          format: date-time
          nullable: true
          description: Fecha y hora de completación (solo para producciones completadas)

    DailyProductionItem:
      type: object
      properties:
        id:
          type: integer
        id_product:
          type: integer
        id_user:
          type: integer
        quantity:
          type: number
          format: float
          description: Cantidad de producto final (decimal 15,2) - 0 si está pending
        type:
          type: string
          enum: [PROD]
          description: Tipo de transacción (siempre PROD para producción)
        direction:
          type: string
          enum: ['+']
          description: Siempre '+' para productos finales
        creation_date:
          type: string
          format: date-time
        modification_date:
          type: string
          format: date-time
          nullable: true
        user_name:
          type: string
        product_name:
          type: string
        sku:
          type: string
        category_name:
          type: string
        status:
          type: string
          enum: [pending, completed]
          description: Estado de la producción (pending = pendiente de completar, completed = completada)
        production_details:
          $ref: '#/components/schemas/ProductionPendingDetails'
          nullable: true
          description: |
            Detalles de materiales consumidos. 
            - Para `pending`: Incluye `registered_by` y `registered_at`
            - Para `completed`: Incluye además `completed_at`

    # Location
    Country:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        is_code:
          type: string
          description: Código ISO del país
        is_active:
          type: boolean

    Province:
      type: object
      properties:
        id:
          type: integer
        id_country:
          type: integer
        name:
          type: string
        is_code:
          type: string
        is_active:
          type: boolean

    City:
      type: object
      properties:
        id:
          type: integer
        id_province:
          type: integer
        name:
          type: string
        is_code:
          type: string
        is_active:
          type: boolean

    # Location Nodes (for hierarchical structure)
    CountryNode:
      type: object
      description: Estructura jerárquica de país con sus provincias y ciudades
      properties:
        id:
          type: integer
          description: ID del país
          example: 1
        name:
          type: string
          description: Nombre del país
          example: "Ecuador"
        is_code:
          type: string
          description: Código ISO del país
          example: "EC"
        provinces:
          type: array
          description: Lista de provincias del país
          items:
            $ref: '#/components/schemas/ProvinceNode'

    ProvinceNode:
      type: object
      description: Estructura jerárquica de provincia con sus ciudades
      properties:
        id:
          type: integer
          description: ID de la provincia
          example: 1
        name:
          type: string
          description: Nombre de la provincia
          example: "Pichincha"
        is_code:
          type: string
          description: Código de la provincia
          example: "PIC"
        cities:
          type: array
          description: Lista de ciudades de la provincia
          items:
            $ref: '#/components/schemas/CityNode'

    CityNode:
      type: object
      description: Estructura de ciudad
      properties:
        id:
          type: integer
          description: ID de la ciudad
          example: 1
        name:
          type: string
          description: Nombre de la ciudad
          example: "Quito"
        is_code:
          type: string
          description: Código de la ciudad
          example: "UIO"

    # Role
    Role:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        description:
          type: string
        is_active:
          type: boolean

    RoleCreate:
      type: object
      required:
        - name
        - permissions
      properties:
        name:
          type: string
        description:
          type: string
        permissions:
          type: array
          items:
            type: integer
          description: Array de IDs de permisos

    Permission:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        description:
          type: string
        resource:
          type: string
        action:
          type: string

    # Alert
    Alert:
      type: object
      properties:
        id:
          type: integer
          description: ID único de la alerta
        alert_type:
          type: string
          description: Tipo de alerta (stock_low, maintenance, payment_overdue, production, custom)
          example: "stock_low"
        alert_title:
          type: string
          maxLength: 200
          description: Título de la alerta
          example: "Stock bajo: Harina de Trigo"
        alert_message:
          type: string
          description: Mensaje descriptivo de la alerta
          example: "El producto tiene stock bajo"
        entity_type:
          type: string
          maxLength: 50
          description: Tipo de entidad relacionada (product, sale, machinery, etc.)
          example: "product"
        entity_id:
          type: string
          maxLength: 50
          description: ID de la entidad relacionada
          example: "123"
        id_transaction:
          type: integer
          description: ID de la transacción relacionada (opcional)
          example: 456
        priority:
          type: string
          enum: [low, medium, high]
          default: medium
          description: Prioridad de la alerta
          example: "high"
        is_active:
          type: boolean
          default: true
          description: Estado activo de la alerta
        resolved_by:
          type: integer
          description: ID del usuario que resolvió la alerta (opcional)
          example: 1
        resolved_at:
          type: string
          format: date-time
          description: Fecha de resolución de la alerta (opcional)
        due_date:
          type: string
          format: date-time
          description: Fecha límite para resolver la alerta (opcional)
        creation_date:
          type: string
          format: date-time
          description: Fecha de creación de la alerta
        modification_date:
          type: string
          format: date-time
          description: Fecha de última modificación (opcional)

    # Machinery
    Machinery:
      type: object
      properties:
        id:
          type: integer
          description: ID único de la maquinaria
        name:
          type: string
          maxLength: 100
          description: Nombre de la maquinaria
          example: "Extrusora Principal"
        description:
          type: string
          maxLength: 100
          description: Descripción de la maquinaria
          example: "Extrusora para producción de snacks"
        is_active:
          type: boolean
          default: true
          description: Estado activo de la maquinaria
        creation_date:
          type: string
          format: date-time
          description: Fecha de creación
        modification_date:
          type: string
          format: date-time
          nullable: true
          description: Fecha de última modificación

    Maintenance:
      type: object
      properties:
        id:
          type: integer
          description: ID único del mantenimiento
        id_machinery:
          type: integer
          description: ID de la maquinaria asociada
        name:
          type: string
          maxLength: 100
          description: Nombre del mantenimiento
          example: "Mantenimiento Preventivo Mensual"
        type:
          type: string
          enum: [PRV, COR]
          description: Tipo de mantenimiento (PRV=Preventivo, COR=Correctivo)
          example: "PRV"
        is_active:
          type: boolean
          default: true
          description: Estado activo del mantenimiento
        next_maintainance_value:
          type: integer
          nullable: true
          description: Días desde el último mantenimiento hasta el próximo
          example: 30
        last_mantainance_date:
          type: string
          format: date-time
          description: Fecha del último mantenimiento
        creation_date:
          type: string
          format: date-time
          description: Fecha de creación
        modification_date:
          type: string
          format: date-time
          nullable: true
          description: Fecha de última modificación
        machinery_name:
          type: string
          description: Nombre de la maquinaria (solo en listados)
        machinery_description:
          type: string
          description: Descripción de la maquinaria (solo en listados)

    MaintenanceHistory:
      type: object
      properties:
        id:
          type: integer
          description: ID único del registro de historial
        id_mantainance:
          type: integer
          description: ID del mantenimiento asociado
        id_user:
          type: integer
          description: ID del usuario que registró el mantenimiento
        details:
          type: object
          description: Detalles del mantenimiento (JSON parseado)
          properties:
            attachments:
              type: array
              items:
                type: object
                properties:
                  id:
                    type: integer
                    description: ID del adjunto
                  content:
                    type: string
                    description: Contenido en base64 o URL
          example:
            attachments:
              - id: 1
                content: "data:image/jpeg;base64,..."
        price:
          type: number
          format: decimal
          description: Precio del mantenimiento
          example: 150.50
        next_mantainance_date:
          type: string
          format: date-time
          nullable: true
          description: Fecha estimada del próximo mantenimiento
        creation_date:
          type: string
          format: date-time
          description: Fecha de creación
        modification_date:
          type: string
          format: date-time
          nullable: true
          description: Fecha de última modificación
        maintenance_name:
          type: string
          description: Nombre del mantenimiento (solo en listados)
        maintenance_type:
          type: string
          enum: [PRV, COR]
          description: Tipo de mantenimiento (solo en listados)
        machinery_name:
          type: string
          description: Nombre de la maquinaria (solo en listados)
        user_name:
          type: string
          description: Nombre del usuario (solo en listados)
        user_email:
          type: string
          description: Email del usuario (solo en listados)

    # Machinery Alerts
    MaintenanceAlertType:
      type: string
      enum: [MAINTENANCE_DUE, MAINTENANCE_SOON]
      description: |
        Tipos de alertas de mantenimiento:
        - MAINTENANCE_DUE: Mantenimiento vencido (next_mantainance_date <= fecha_actual)
        - MAINTENANCE_SOON: Mantenimiento próximo a vencer (preventiva/informativa, dentro de X días)
      example: "MAINTENANCE_DUE"

    MachineryAlert:
      type: object
      properties:
        id:
          type: integer
          description: ID único de la alerta
        id_mantainance:
          type: integer
          description: ID del mantenimiento asociado
        type:
          $ref: '#/components/schemas/MaintenanceAlertType'
          description: Tipo de alerta
          example: "MAINTENANCE_DUE"
        date:
          type: string
          format: date-time
          description: Fecha del evento
        title:
          type: string
          maxLength: 150
          description: Título de la alerta
          example: "Mantenimiento Vencido: Mantenimiento Preventivo Mensual"
        message:
          type: string
          description: Mensaje de la alerta
        is_sent:
          type: boolean
          default: false
          description: Indica si ya se notificó
        creation_date:
          type: string
          format: date-time
          description: Fecha de creación
        maintenance_name:
          type: string
          description: Nombre del mantenimiento (solo en listados)
        maintenance_type:
          type: string
          enum: [PRV, COR]
          description: Tipo de mantenimiento (solo en listados)
        machinery_name:
          type: string
          description: Nombre de la maquinaria (solo en listados)

    AlertUser:
      type: object
      properties:
        id:
          type: integer
          description: ID único
        id_machinery_alert:
          type: integer
          description: ID de la alerta
        id_user:
          type: integer
          description: ID del usuario
        is_read:
          type: boolean
          default: false
          description: Indica si la alerta fue leída
        read_date:
          type: string
          format: date-time
          nullable: true
          description: Fecha de lectura
        creation_date:
          type: string
          format: date-time
          description: Fecha de creación

    UserDevice:
      type: object
      properties:
        id:
          type: integer
          description: ID único del dispositivo
        id_user:
          type: integer
          description: ID del usuario
        device_token:
          type: string
          description: Token del dispositivo para notificaciones push
        platform:
          type: string
          enum: [ios, android, web]
          description: Plataforma del dispositivo
        is_active:
          type: boolean
          default: true
          description: Estado activo del dispositivo
        creation_date:
          type: string
          format: date-time
          description: Fecha de registro
        modification_date:
          type: string
          format: date-time
          nullable: true
          description: Fecha de última modificación

    # Stats
    DetailedStatsResponse:
      type: object
      description: Estadísticas detalladas del sistema
      properties:
        products:
          type: object
          properties:
            total:
              type: integer
              description: Total de productos finales
            active:
              type: integer
              description: Productos activos
            inactive:
              type: integer
              description: Productos inactivos
            lowStock:
              type: integer
              description: Productos con stock bajo
            totalInventoryValue:
              type: number
              format: float
              description: Valor total del inventario
        categories:
          type: object
          properties:
            total:
              type: integer
            active:
              type: integer
            inactive:
              type: integer
        sales:
          type: object
          properties:
            total:
              type: integer
            active:
              type: integer
            cancelled:
              type: integer
            byStatus:
              type: object
              properties:
                pending:
                  type: integer
                paid:
                  type: integer
                overdue:
                  type: integer
                cancelled:
                  type: integer
            totalValue:
              type: number
              format: float
            paidValue:
              type: number
              format: float
            pendingValue:
              type: number
              format: float
            overdueValue:
              type: number
              format: float
            thisMonth:
              type: object
              properties:
                count:
                  type: integer
                value:
                  type: number
                  format: float
            thisYear:
              type: object
              properties:
                count:
                  type: integer
                value:
                  type: number
                  format: float
            byWeek:
              type: array
              description: Ventas agrupadas por semana del mes actual
              items:
                type: object
                properties:
                  week:
                    type: integer
                    description: Número de semana (1-5)
                    example: 2
                  week_label:
                    type: string
                    description: Etiqueta descriptiva de la semana
                    example: "Semana 2 (8-14)"
                  count:
                    type: integer
                    description: Cantidad de ventas en la semana
                    example: 5
                  value:
                    type: number
                    format: float
                    description: Valor total de ventas en la semana
                    example: 750.50
        clients:
          type: object
          properties:
            total:
              type: integer
            active:
              type: integer
            inactive:
              type: integer
            withCredit:
              type: integer
            totalCreditLimit:
              type: number
              format: float
        production:
          type: object
          properties:
            total:
              type: integer
              description: Total de transacciones de producción
            thisMonth:
              type: integer
              description: Transacciones de producción del mes actual
            thisYear:
              type: integer
              description: Transacciones de producción del año actual
            daily:
              type: array
              description: Producción diaria de los últimos 7 días (solo producto final generado)
              items:
                type: object
                properties:
                  date:
                    type: string
                    format: date
                    description: Fecha de la producción (YYYY-MM-DD)
                    example: "2026-01-13"
                  day_label:
                    type: string
                    description: 'Etiqueta del día con formato "Día DD" (ej: "Lun 13")'
                    example: "Lun 13"
                  production:
                    type: number
                    format: float
                    description: Cantidad total producida en el día
                    example: 1200.0
                  waste:
                    type: number
                    format: float
                    description: Cantidad total de desperdicio en el día
                    example: 45.0
        alerts:
          type: object
          properties:
            total:
              type: integer
            active:
              type: integer
            byPriority:
              type: object
              properties:
                low:
                  type: integer
                medium:
                  type: integer
                high:
                  type: integer
            byType:
              type: object
              additionalProperties:
                type: integer
              description: "Alertas agrupadas por tipo (ej: stock_low, maintenance, etc.)"
        users:
          type: object
          properties:
            total:
              type: integer
            active:
              type: integer
            inactive:
              type: integer
        transactions:
          type: object
          properties:
            total:
              type: integer
            thisMonth:
              type: integer
            recent:
              type: array
              description: Últimas 5 transacciones registradas
              maxItems: 5
              items:
                type: object
                properties:
                  id:
                    type: integer
                    description: ID de la transacción
                  product_name:
                    type: string
                    description: Nombre del producto
                  product_sku:
                    type: string
                    description: SKU del producto
                  user_name:
                    type: string
                    description: Nombre del usuario que realizó la transacción
                  quantity:
                    type: number
                    format: float
                    description: Cantidad de la transacción
                  type:
                    type: string
                    enum: [IN, OUT, SAL, PROD]
                    description: Tipo de transacción (IN=Ingreso, OUT=Salida no comercial, SAL=Venta, PROD=Producción)
                  direction:
                    type: string
                    enum: ['+', '-']
                    description: Dirección de la transacción (+=Entrada, -=Salida)
                  creation_date:
                    type: string
                    format: date-time
                    description: Fecha de creación de la transacción
                  has_waste:
                    type: boolean
                    description: Indica si la transacción tiene desperdicio (solo para PROD)
                  waste_quantity:
                    type: number
                    format: float
                    nullable: true
                    description: Cantidad de desperdicio (solo si has_waste es true)

paths:
  /auth/login:
    post:
      tags:
        - Authentication
      summary: Iniciar sesión
      description: Autentica un usuario y devuelve un token JWT
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login exitoso
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/LoginResponse'
        '401':
          description: Credenciales inválidas
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '400':
          description: Error de validación
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /auth/register:
    post:
      tags:
        - Authentication
      summary: Registrar nuevo usuario
      description: Crea un nuevo usuario en el sistema
      operationId: register
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Usuario registrado exitosamente
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/User'
        '400':
          description: Error de validación o usuario ya existe
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /auth/refresh:
    post:
      tags:
        - Authentication
      summary: Refrescar token
      description: Obtiene un nuevo token de acceso usando un refresh token
      operationId: refreshToken
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequest'
      responses:
        '200':
          description: Token refrescado exitosamente
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/LoginResponse'
        '401':
          description: Token inválido o expirado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /auth/logout:
    post:
      tags:
        - Authentication
      summary: Cerrar sesión
      description: Invalida el token de acceso del usuario
      operationId: logout
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Sesión cerrada exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '401':
          description: No autenticado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /auth/change-password:
    post:
      tags:
        - Authentication
      summary: Cambiar contraseña
      description: Permite a un usuario cambiar su contraseña
      operationId: changePassword
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
      responses:
        '200':
          description: Contraseña cambiada exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '400':
          description: Contraseña actual incorrecta
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: No autenticado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /auth/reset-password:
    post:
      tags:
        - Authentication
      summary: Solicitar reset de contraseña
      description: Envía un email con un token para resetear la contraseña
      operationId: requestPasswordReset
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPasswordRequest'
      responses:
        '200':
          description: Email enviado exitosamente
          content:
            application/json:
              schema:
