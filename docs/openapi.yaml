      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Detalles de la alerta
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/MachineryAlert'

  /machinery-alerts/{id}/read:
    put:
      tags:
        - Machinery
      summary: Marcar alerta como leída
      operationId: markAlertAsRead
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Alerta marcada como leída
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/AlertUser'

  /machinery-alerts/{id}/assign:
    post:
      tags:
        - Machinery
      summary: Asignar alerta a usuarios
      operationId: assignAlertToUsers
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - user_ids
              properties:
                user_ids:
                  type: array
                  items:
                    type: integer
                  minItems: 1
                  description: IDs de usuarios a los que asignar la alerta
      responses:
        '200':
          description: Alerta asignada exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'

  /machinery-alerts/device:
    post:
      tags:
        - Machinery
      summary: Registrar dispositivo para notificaciones push
      operationId: registerUserDevice
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - device_token
                - platform
              properties:
                device_token:
                  type: string
                  description: Token del dispositivo para notificaciones push
                platform:
                  type: string
                  enum: [ios, android, web]
                  description: Plataforma del dispositivo
      responses:
        '201':
          description: Dispositivo registrado exitosamente
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/UserDevice'

  /machinery-alerts/send:
    post:
      tags:
        - Machinery
      summary: Enviar alertas de maquinaria pendientes
      operationId: sendPendingMachineryAlerts
      security:
        - bearerAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                limit:
                  type: integer
                  default: 50
                  description: Cantidad máxima de alertas a procesar
      responses:
        '200':
          description: Envío de alertas ejecutado
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          processed:
                            type: integer
                          sent:
                            type: integer
                          failed:
                            type: integer
                          skipped:
                            type: integer

  /machinery-alerts/device/{id}:
    delete:
      tags:
        - Machinery
      summary: Desregistrar dispositivo
      operationId: unregisterUserDevice
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Dispositivo desregistrado exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'

  /machinery-alerts/detect:
    get:
      tags:
        - Machinery
      summary: Ejecutar detección de alertas de mantenimiento (Admin)
      description: |
        Ejecuta manualmente el proceso de detección de mantenimientos vencidos y próximos a vencer, generando alertas.
        
        **Tipos de alertas generadas:**
        - `MAINTENANCE_DUE`: Mantenimientos vencidos (next_mantainance_date <= fecha_actual)
        - `MAINTENANCE_SOON`: Mantenimientos próximos a vencer (dentro de los días especificados)
      operationId: detectMaintenanceAlerts
      security:
        - bearerAuth: []
      parameters:
        - name: days_before_due
          in: query
          description: "Días de anticipación para alertas preventivas (default: 1 día)"
          schema:
            type: integer
            default: 1
            minimum: 1
          example: 1
      responses:
        '200':
          description: Detección ejecutada exitosamente
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          daysBeforeDue:
                            type: integer
                            description: Días de anticipación configurados para alertas preventivas

  /healthcheck:
    get:
      tags:
        - System
      summary: Health check del sistema
      description: Verifica el estado de salud del sistema, incluyendo conexión a base de datos y variables de entorno críticas
      operationId: healthcheck
      responses:
        '200':
          description: Sistema saludable o degradado pero funcional
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum: [healthy, degraded, unhealthy]
                  timestamp:
                    type: string
                    format: date-time
                  uptime:
                    type: number
                    description: Tiempo de actividad en segundos
                  responseTime:
                    type: string
                    example: "45ms"
                  checks:
                    type: object
                    properties:
                      api:
                        type: object
                        properties:
                          status:
                            type: string
                          message:
                            type: string
                      database:
                        type: object
                        properties:
                          status:
                            type: string
                          message:
                            type: string
                      environment:
                        type: object
                        properties:
                          status:
                            type: string
                          message:
                            type: string
        '503':
          description: Sistema no saludable
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: unhealthy
                  checks:
                    type: object

  /stats:
    get:
      tags:
        - Stats
      summary: Estadísticas generales
      description: |
        Obtiene estadísticas generales del sistema incluyendo:
        - Productos: total, activos, inactivos, con stock bajo, valor total de inventario
        - Categorías: total, activas, inactivas
        - Ventas: total, activas, canceladas, por estado, valores totales, del mes/año actual, agrupadas por semana del mes actual
        - Clientes: total, activos, inactivos, con crédito, límite total de crédito
        - Producción: total, del mes/año actual
        - Alertas: total, activas, por prioridad, por tipo
        - Usuarios: total, activos, inactivos
        - Transacciones: total, del mes actual, últimas 5 transacciones recientes
      operationId: getStats
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Estadísticas del sistema
          content:
            application/json:
              schema:
