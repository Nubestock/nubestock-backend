  /production/daily:
    get:
      tags:
        - Production
      summary: Obtener producción diaria
      description: |
        Obtiene la producción diaria con filtros opcionales.
        
        Incluye información detallada de:
        - Estado de la producción (pending/completed)
        - Materiales consumidos con desperdicios (para ambos estados)
        - Cantidad de producto final generado
        
        **Filtro por estado:**
        - `status=pending`: Solo producciones pendientes (tienen registro en `tb_ope_pending_transaction` con `is_active=true`)
        - `status=completed`: Solo producciones completadas (NO tienen registro activo en `tb_ope_pending_transaction`)
        - Sin parámetro: Todas las producciones (tanto pendientes como completadas), combinadas y ordenadas por fecha
        
        **Respuesta incluye:**
        - `productions`: Array de producciones con su estado (`pending` o `completed`)
        - `summary`: Resumen con totales de pendientes y completadas
        - `pagination`: Información de paginación
        
        **Identificación de estado:**
        - `pending`: Transacción `PROD` con registro en `tb_ope_pending_transaction` donde `is_active=true`
        - `completed`: Transacción `PROD` sin registro activo en `tb_ope_pending_transaction` o con `is_active=false`
      operationId: getDailyProduction
      security:
        - bearerAuth: []
      parameters:
        - name: startDate
          in: query
          schema:
            type: string
            format: date
          description: Fecha de inicio (YYYY-MM-DD)
        - name: endDate
          in: query
          schema:
            type: string
            format: date
          description: Fecha de fin (YYYY-MM-DD)
        - name: id_user
          in: query
          schema:
            type: integer
          description: Filtrar por usuario
        - name: id_product
          in: query
          schema:
            type: integer
          description: Filtrar por producto final
        - name: status
          in: query
          schema:
            type: string
            enum: [pending, completed]
          description: Filtrar por estado de producción
        - name: page
          in: query
          schema:
            type: integer
            default: 1
          description: Número de página
        - name: limit
          in: query
          schema:
            type: integer
            default: 10
          description: Cantidad de registros por página
      responses:
        '200':
          description: Lista de producción diaria con resumen de estados
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      productions:
                        type: array
                        items:
                          $ref: '#/components/schemas/DailyProductionItem'
                      summary:
                        type: object
                        properties:
                          total:
                            type: integer
                            description: Total de producciones (pendientes + completadas)
                          total_pending:
                            type: integer
                            description: Total de producciones pendientes
                          total_completed:
                            type: integer
                            description: Total de producciones completadas
                          in_current_page:
                            type: object
                            properties:
                              pending:
                                type: integer
                                description: Cantidad de pendientes en la página actual
                              completed:
                                type: integer
                                description: Cantidad de completadas en la página actual
                      pagination:
                        type: object
                        properties:
                          page:
                            type: integer
                          limit:
                            type: integer
                          total:
                            type: integer
                          totalPages:
                            type: integer
                  timestamp:
                    type: string
                    format: date-time
              examples:
                pending:
                  summary: Producción pendiente (filtro status=pending)
                  value:
                    success: true
                    message: "Producciones diarias obtenidas exitosamente. Filtro: pending"
                    data:
                      productions:
                        - id: 123
                          id_product: 83
                          id_user: 5
                          quantity: 0
                          type: "PROD"
                          direction: "+"
                          is_pending: true
                          creation_date: "2026-01-12T10:00:00Z"
                          modification_date: null
