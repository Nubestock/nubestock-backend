  /alerts:
    get:
      tags:
        - Alerts
      summary: Listar alertas
      operationId: listAlerts
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 10
        - name: is_active
          in: query
          schema:
            type: boolean
        - name: priority
          in: query
          schema:
            type: string
            enum: [high, medium, low]
        - name: entity_type
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Lista de alertas
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PaginatedResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/Alert'

    post:
      tags:
        - Alerts
      summary: Crear alerta
      description: "Crea una nueva alerta en el sistema. Las alertas pueden ser de diferentes tipos: stock bajo, mantenimiento, pago vencido, producción, etc."
      operationId: createAlert
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - alert_type
                - alert_title
                - alert_message
              properties:
                alert_type:
                  type: string
                  description: Tipo de alerta
                  enum: [stock_low, maintenance, payment_overdue, production, custom]
                  example: "stock_low"
                alert_title:
                  type: string
                  maxLength: 200
                  description: Título de la alerta
                  example: "Stock bajo: Harina de Trigo"
                alert_message:
                  type: string
                  description: Mensaje descriptivo de la alerta
                  example: "El producto 'Harina de Trigo' tiene stock bajo. Stock actual: 50, Mínimo requerido: 100"
                entity_type:
                  type: string
                  maxLength: 50
                  description: "Tipo de entidad relacionada (ej: 'product', 'sale', 'machinery')"
                  example: 'product'
                entity_id:
                  type: string
                  maxLength: 50
                  description: ID de la entidad relacionada
                  example: "123"
                id_transaction:
                  type: integer
                  description: ID de la transacción relacionada (opcional)
                  example: 456
                priority:
                  type: string
                  enum: [low, medium, high]
                  default: medium
                  description: Prioridad de la alerta
                  example: "high"
                due_date:
                  type: string
                  format: date-time
                  description: Fecha límite para resolver la alerta (opcional)
                  example: "2025-02-01T00:00:00Z"
                is_active:
                  type: boolean
                  default: true
                  description: Estado activo de la alerta
      responses:
        '201':
          description: Alerta creada exitosamente
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Alert'
        '400':
          description: Error de validación
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: No autenticado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Sin permisos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

